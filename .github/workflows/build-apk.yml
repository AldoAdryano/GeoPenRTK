name: Build GeoPen RTK APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "GeoPenRTK_CloudBuild_v0.2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil isi repository
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Pasang Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ekstrak source code
        run: unzip -q -o GeoPenRTK_CloudBuild_v0.2.zip

      - name: Build APK debug
        working-directory: GeoPenRTK_CloudBuild_v0.2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPenRTK-debug-apk
          path: GeoPenRTK_CloudBuild_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
